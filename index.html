<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,system-ui,sans-serif}
:root{--bg:#ffffff;--soft:#f3ebff;--sf:#ffffff;--gl:rgba(255,255,255,.92);--bd:#e9dcff;--tx:#1f1235;--t2:#7a6b93;--ac:#8250df;--ach:#6f42c1;--ag:rgba(130,80,223,.25);--ok:#16a34a;--okb:#e8f8ee;--er:#dc2626;--erb:#fee9e7;--wa:#d97706;--sh:0 10px 30px rgba(130,80,223,.14);--r:14px}

.center:before{content:'';position:absolute;inset:-30%;background:radial-gradient(circle at 25% 30%,rgba(130,80,223,.09),transparent 45%),radial-gradient(circle at 75% 70%,rgba(167,139,250,.09),transparent 45%);animation:bg 18s ease-in-out infinite;pointer-events:none}

.pulse b{width:8px;height:8px;border-radius:50%;background:var(--ac);animation:dot 1.3s infinite}.pulse b:nth-child(2){animation-delay:.2s}.pulse b:nth-child(3){animation-delay:.4s}
@keyframes pl{50%{opacity:.55}}@keyframes dot{50%{transform:scale(1.5);opacity:.4}}
.qh{display:flex;justify-content:flex-end;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 18px;background:var(--gl);backdrop-filter:blur(14px);border-bottom:3px solid var(--ac);position:sticky;top:0;z-index:50}

.opt.lock{pointer-events:none}.opt.lock:not(.c):not(.x){opacity:.55}
.opt.c{border-color:var(--ok);background:var(--okb);animation:pop .4s}.opt.c .l{background:var(--ok);color:#fff;border-color:var(--ok)}
.opt.x{border-color:var(--er);background:var(--erb);animation:wob .4s}.opt.x .l{background:var(--er);color:#fff;border-color:var(--er)}
@keyframes pop{50%{transform:scale(1.04)}}@keyframes wob{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.fly{position:fixed;z-index:200;font-weight:800;font-size:30px;pointer-events:none;color:var(--ok);text-shadow:0 2px 12px rgba(0,0,0,.25)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:16px 0}

.code{display:inline-flex;align-items:center;gap:12px;padding:10px 18px;border:2px dashed var(--ac);background:#ffffff;border-radius:18px;font-size:34px;font-weight:800;letter-spacing:8px;color:var(--ac)}
.sc{overflow-x:auto;border:1px solid var(--bd);border-radius:18px;background:var(--sf);box-shadow:var(--sh)}
.row{display:grid;grid-template-columns:52px 44px 1fr 70px 80px 80px;align-items:center;gap:6px;padding:10px 14px;border-bottom:1px solid var(--bd);min-width:460px;font-size:14px;background:var(--sf)}

.bd{display:inline-block;font-size:11px;font-weight:700;border-radius:20px;padding:2px 10px;background:#f3ebff;color:var(--ach)}
.pod{display:flex;align-items:flex-end;justify-content:center;gap:14px;padding:30px 0 6px}
.pi{display:flex;flex-direction:column;align-items:center;text-align:center;animation:rise .8s cubic-bezier(.2,.8,.2,1) both;min-width:96px}
.pi:nth-child(1){animation-delay:.35s}.pi:nth-child(2){animation-delay:.1s}.pi:nth-child(3){animation-delay:.55s}
@keyframes rise{from{opacity:0;transform:translateY(60px)}}
.pi .pa{font-size:42px}.pi.f .pa{font-size:60px;animation:glow 2s infinite}
@keyframes glow{50%{filter:drop-shadow(0 0 18px #8250df)}}
.pb{width:100%;border-radius:12px 12px 0 0;margin-top:10px;display:flex;justify-content:center;padding-top:10px;font-size:24px;color:#fff;box-shadow:0 8px 18px rgba(130,80,223,.2)}
.f .pb{height:110px;background:linear-gradient(#8250df,#6f42c1)}.s .pb{height:80px;background:linear-gradient(#a78bfa,#8b5cf6)}.t .pb{height:60px;background:linear-gradient(#c4b5fd,#a78bfa)}
.stats2{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:18px}
.big{font-size:54px;font-weight:800;line-height:1.1}
.chart{height:320px;position:relative;background:var(--sf);border:1px solid var(--bd);border-radius:22px;padding:14px;box-shadow:var(--sh)}
.ov{position:fixed;inset:0;background:rgba(31,18,53,.5);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:300;padding:20px;animation:fi .2s}
@keyframes fi{from{opacity:0}}
.md{background:var(--sf);border-top:6px solid var(--ac);border-radius:24px;padding:28px;max-width:420px;width:100%;box-shadow:var(--sh);text-align:center;animation:mp .3s cubic-bezier(.2,.8,.2,1)}
@keyframes mp{from{opacity:0;transform:scale(.92)}}
.toast{position:fixed;top:78px;left:50%;transform:translateX(-50%);padding:12px 26px;border-radius:50px;color:#fff;font-weight:600;z-index:400;box-shadow:var(--sh);animation:in .3s;background:var(--ach)}.toast.e{background:var(--er)}
#cf{position:fixed;inset:0;pointer-events:none;z-index:250}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:640px){.avs{grid-template-columns:repeat(5,1fr)}.qc{padding:20px}.qt{font-size:19px}.code{font-size:26px;letter-spacing:5px}.big{font-size:44px}.pi{min-width:78px}.row2{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>

<script>
// ===== CONFIG =====
const SB_URL='https://pwywpfaideughyzxtmrh.supabase.co', SB_KEY='sb_publishable_i6UihK2U_8GlKMEOqpsVpg_pZGIv6_i';
const HOST_HASH='2fcdb3b1e185c90ad825cd5c8d055f6e8d74a287ec69d137e601d0652503408a';
const AVATARS=['👨‍💻','👩‍💻','🧑‍💻','🐱','🐶','🦊','🐼','🐸','🦁','🐯','🐨','🐵','🤖','👽','🚀','🧙','🥷','🦄','⚡','🔥'];
const GH='M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.42-.12.85-.18 1.29-.18s.87.06 1.29.18c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z';
const logo=s=>`<svg viewBox="0 0 16 16" width="${s}" height="${s}" fill="currentColor"><path fill-rule="evenodd" d="${GH}"/></svg>`;
const $=id=>document.getElementById(id), L=localStorage;
const h=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let sb=null; try{ sb=supabase.createClient(SB_URL,SB_KEY,{realtime:{params:{eventsPerSecond:20}}}) }catch(e){}
const S={me:{id:L.gq_id||'p_'+Date.now().toString(36)+Math.random().toString(36).slice(2,8),name:L.gq_name||'',avatar:L.gq_av||AVATARS[2],
  redg:L.gq_redg||'',email:L.gq_email||'',year:L.gq_year||'',dept:L.gq_dept||''},
  room:null,players:[],phase:'join',host:false,qi:0,score:0,ok:0,ms:0,lock:false,chart:null,ch:null,
  tabSwitches:0,lastVisibility:'visible',tabSwitchPenaltyApplied:false};
L.gq_id=S.me.id;

// ===== helpers =====
function toast(m,e){const t=document.createElement('div');t.className='toast'+(e?' e':'');t.textContent=m;document.body.appendChild(t);setTimeout(()=>{t.style.opacity=0;setTimeout(()=>t.remove(),300)},2200)}
function view(html){$('app').innerHTML='<div>'+html+'</div>';scrollTo(0,0)}
function modal(html){$('md').innerHTML=`<div class="ov" onclick="if(event.target==this)closeM()"><div class="md">${html}</div></div>`}
function closeM(){$('md').innerHTML=''}
function theme(t){t=typeof t==='string'?t:(document.documentElement.dataset.theme==='dark'?'light':'dark');document.documentElement.dataset.theme=t;
  const tk=$('tk'); if(tk) tk.textContent=t==='dark'?'🌙':'☀️';
  L.gq_theme=t;
  if(S.chart){S.chart.options.scales.x.ticks.color=S.chart.options.scales.y.ticks.color=getComputedStyle(document.body).getPropertyValue('--t2');S.chart.update('none')}}
const sorted=a=>[...a].sort((x,y)=>y.score-x.score||x.ms-y.ms);
const medal=i=>['🥇','🥈','🥉'][i]||('#'+(i+1));
const Q=()=>S.room.quiz.questions;
function needDb(){if(!sb){toast('Supabase not configured',1);return true}}
function count(el,to,ms=1200){const t0=performance.now();(function f(n){const p=Math.min(1,(n-t0)/ms);el.textContent=Math.round(to*(1-Math.pow(1-p,3))).toLocaleString();if(p<1)requestAnimationFrame(f)})(t0)}
function flip(box,fn){const b={};box.querySelectorAll('[data-id]').forEach(e=>b[e.dataset.id]=e.getBoundingClientRect().top);fn();box.querySelectorAll('[data-id]').forEach(e=>{const o=b[e.dataset.id];if(o==null)return;const d=o-e.getBoundingClientRect().top;if(d){e.style.transition='none';e.style.transform=`translateY(${d}px)`;requestAnimationFrame(()=>{e.style.transition='transform .5s cubic-bezier(.2,.8,.2,1)';e.style.transform=''})}})}
function lbHtml(ps,me){return`<div class="row h"><span>Rank</span><span></span><span>Player</span><span>Correct</span><span>Time</span><span>Score</span></div>`+sorted(ps).map((p,i)=>`<div class="row ${p.id===me?'me':''}" data-id="${h(p.id)}"><b class="rk">${medal(i)}</b><span class="av2">${h(p.avatar)}</span><span class="nm">${h(p.name)}${p.id===me?'<i class="you">YOU</i>':''}</span><span>${p.ok}</span><span>${(p.ms/1000).toFixed(1)}s</span><b>${p.score}</b></div>`).join('')}
function setLb(id,me){const b=$(id);if(b)flip(b,()=>b.innerHTML=lbHtml(S.players,me))}
function podHtml(ps){const t=sorted(ps).slice(0,3);const o=[[1,'s','🥈','SECOND'],[0,'f','🥇','FIRST'],[2,'t','🥉','THIRD']];return o.filter(x=>t[x[0]]).map(([i,c,m])=>{const p=t[i];return`<div class="pi ${c}"><div class="pa">${h(p.avatar)}</div><b>${h(p.name)}</b><small class="sub">${p.score} pts · ${p.ok} correct</small><div class="pb">${m}</div></div>`}).join('')}

// ===== dynamic nav (only shown on quiz page) =====
function mountNav(){
  if(document.querySelector('nav.site-nav')) return;
  const n=document.createElement('nav');
  n.className='site-nav';
  n.innerHTML=`<div class="brand" onclick="home()"><span id="lg">${logo(30)}</span><span class="grad">GITHUB QUIZ PORTAL</span></div><button class="tog" onclick="theme()" aria-label="Toggle theme"><i id="tk">☀️</i></button>`;
  document.body.insertBefore(n, document.body.firstChild);
  const cur=L.gq_theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');
  if(cur==='dark') document.documentElement.dataset.theme='dark';
  const tk=document.getElementById('tk'); if(tk) tk.textContent=(document.documentElement.dataset.theme==='dark')?'🌙':'☀️';
}
function unmountNav(){const n=document.querySelector('nav.site-nav'); if(n) n.remove();}

// ===== confetti =====
function confetti(sec=4.5){const c=$('cf'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;c.classList.remove('hide');const P=Array.from({length:110},()=>({x:Math.random()*c.width,y:-Math.random()*c.height,w:6+Math.random()*7,v:2+Math.random()*3,dx:Math.random()*2-1,r:Math.random()*6,s:Math.random()*.2-.1,k:['#8250df','#a78bfa','#c4b5fd','#ddd6fe','#6f42c1'][Math.random()*5|0]}));const end=Date.now()+sec*1000;(function f(){x.clearRect(0,0,c.width,c.height);if(Date.now()>end){c.classList.add('hide');return}P.forEach(p=>{p.y+=p.v;p.x+=p.dx;p.r+=p.s;if(p.y>c.height)p.y=-10;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.k;x.fillRect(-p.w/2,-3,p.w,6);x.restore()});requestAnimationFrame(f)})()}

// ===== tab switching tracker =====
function setupTabDetection(){S.tabSwitches=0;S.tabSwitchPenaltyApplied=false;document.removeEventListener('visibilitychange',handleVisibility);document.addEventListener('visibilitychange',handleVisibility);window.removeEventListener('blur',handleBlur);window.addEventListener('blur',handleBlur)}
function handleVisibility(){if(document.hidden&&S.phase==='quiz'&&!S.lock)S.tabSwitches++}
function handleBlur(){if(S.phase==='quiz'&&!S.lock&&document.visibilityState==='visible'){setTimeout(()=>{if(document.visibilityState==='visible'&&S.phase==='quiz'&&!S.lock)S.tabSwitches++},100)}}
function resetTabDetection(){document.removeEventListener('visibilitychange',handleVisibility);window.removeEventListener('blur',handleBlur)}

 .on('postgres_changes',{event:'*',schema:'public',table:'players',filter:'room_code=eq.'+code},()=>{clearTimeout(deb);deb=setTimeout(loadPlayers,700)}).subscribe();
 poll=setInterval(async()=>{const{data}=await sb.from('rooms').select('*').eq('code',code).single();if(data){const ch=data.status!==S.room.status;S.room=data;if(ch)onRoom()}loadPlayers()},5000)}

function showQ(){

  view(`<div class="qh"><div class="st">

      <div class="ring" id="rg"><svg width="54" height="54" viewBox="0 0 54 54"><circle class="bg" cx="27" cy="27" r="23"/><circle class="fg" id="fg" cx="27" cy="27" r="23" stroke-dasharray="144.5" stroke-dashoffset="0"/></svg><span id="tx">${T}</span></div>
  </div></div>
  <div class="q"><div class="qc"><div class="qn">${h(q.difficulty||'')}</div><div class="qt">${h(q.question)}</div>${Object.entries(q.options).map(([k,v])=>`<div class="opt" data-k="${h(k)}" onclick="ans('${h(k)}')"><span class="l">${h(k)}</span><span>${h(v)}</span></div>`).join('')}</div></div>`);
  S.t0=Date.now();
  const tick=()=>{if(S.lock)return;const u=(Date.now()-S.t0)/1000,left=Math.max(0,T-u);
    $('fg').style.strokeDashoffset=144.5*(u/T);$('tx').textContent=Math.ceil(left);
    $('rg').className='ring '+(left<=5?'d':left<=10?'w':'');
    const sw=$('sw'); if(sw) sw.textContent=S.tabSwitches;
    if(left<=0)ans(null);else S.raf=requestAnimationFrame(tick)};
  S.raf=requestAnimationFrame(tick);
}
function ans(k){
  if(S.lock)return;S.lock=true;cancelAnimationFrame(S.raf);
  const q=Q()[S.qi],T=S.room.time_per_q,used=Math.min(T,(Date.now()-S.t0)/1000);
  const good=k===q.correct_answer;
  let pts=good?Math.round(500+500*(1-used/T)):0;
  let penaltyFactor = 1;
  if(S.tabSwitches > 0){penaltyFactor = Math.max(0.3, 1 - (S.tabSwitches * 0.1));pts = Math.round(pts * penaltyFactor);if(pts < 0) pts = 0;}
  S.score += pts;S.ok += good?1:0;S.ms += Math.round(used*1000);S.qi++;
  const fin = S.qi >= Q().length;
  sb.from('players').update({score:S.score, ok:S.ok, ms:S.ms, done:S.qi, fin, last_active:new Date().toISOString()}).eq('id',S.me.id).eq('room_code',S.room.code).then(r=>{if(r.error)toast('Sync issue — retrying',1)});
  document.querySelectorAll('.opt').forEach(o=>{o.classList.add('lock');const c=o.dataset.k===q.correct_answer;if(c){o.classList.add('c');o.firstChild.textContent='✓'}else if(o.dataset.k===k){o.classList.add('x');o.firstChild.textContent='✕'}});
  fly(pts);
  if(S.tabSwitches > 0 && good){const penMsg = document.createElement('div');penMsg.className='fly';penMsg.textContent = `−${Math.round((1-penaltyFactor)*100)}% (${S.tabSwitches} tab switch${S.tabSwitches>1?'es':''})`;penMsg.style.cssText += `left:50%;top:55%;translate:-50% -50%;color:var(--er);font-size:20px`;document.body.appendChild(penMsg);setTimeout(()=>penMsg.remove(), 1500);}
  setTimeout(()=>fin?showResults():showQ(), good?900:1400);
}
function fly(p){const e=document.createElement('div');e.className='fly';e.textContent=p?`+${p} POINTS`:(S.lock?'0 POINTS':'');e.style.cssText+=`left:50%;top:45%;translate:-50% -50%;${p?'':'color:var(--er)'}`;document.body.appendChild(e);const t=$('sc').getBoundingClientRect(),m=e.getBoundingClientRect();
 e.animate([{opacity:0,transform:'scale(.5)'},{opacity:1,transform:'scale(1.15)',offset:.25},{opacity:1,transform:'scale(1)',offset:.55},{opacity:0,transform:`translate(${t.left-m.left-m.width/2+20}px,${t.top-m.top}px) scale(.4)`}],{duration:1100,easing:'ease-in-out'}).onfinish=()=>{e.remove();const s=$('sc');if(s)count(s,S.score,350)}}

function validate(t){let j;try{j=JSON.parse(t)}catch(e){throw'That is not valid JSON ('+e.message+'). Check commas and quotes.'}
 if(!j||typeof j.title!=='string'||!j.title)throw'Add a "title" for the quiz.';if(!Array.isArray(j.questions)||!j.questions.length)throw'Add a non-empty "questions" array.';

  if(!error){S.room=data;L.gq_host_room=code;S.players=[];sub(code);return renderHost()}}
 $('err').textContent='Could not create the room. Check the schema and keys.'}
async function resume(){const c=$('rc').value.trim().toUpperCase();const{data}=await sb.from('rooms').select('*').eq('code',c).single();if(!data)return toast('Room not found',1);S.room=data;L.gq_host_room=c;sub(c);renderHost()}
function hostDash(){const r=S.room;view(`<div class="wrap"><div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px"><div style="display:flex;align-items:center;gap:12px"><span style="color:var(--ac)">${logo(38)}</span><div><h1 style="font-size:22px">Host Dashboard</h1><div class="sub">${h(r.quiz.title)}</div></div></div><button class="btn t s" onclick="home()">← Exit</button></div>
 <div class="card w" style="margin-top:16px"><div class="sub" style="font-weight:600">ROOM CODE</div><div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin:8px 0 16px"><span class="code">${r.code}</span><button class="btn" id="cp" onclick="copyCode()">COPY ROOM CODE</button><span class="bd" id="rs"></span></div>
 <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
   <button class="btn g" onclick="setStatus('live')">START QUIZ</button>
   <button class="btn d" onclick="setStatus('ended')">END QUIZ</button>
   <button class="btn" onclick="newQuiz()">NEW QUIZ</button>
   <button class="btn p" id="topResBtn" onclick="showTopResults()" style="margin-left:auto">🏆 TOP RESULTS</button>
 </div></div>
 <div class="grid" id="stats"></div>
 <h2 style="margin:20px 0 10px">Live leaderboard</h2><div class="sc"><div id="hl"></div></div>
 <h2 style="margin:24px 0 10px">Login log</h2><div class="sc"><div id="lg2"></div></div>
 <div id="hostChartArea" class="hide" style="margin-top:26px">
   <h2 style="margin-bottom:12px">📊 Top participants histogram</h2>
   <div class="chart"><canvas id="hostChart"></canvas></div>
 </div>
 </div>`);loadPlayers()}
function showTopResults(){const area = $('hostChartArea');if(!area) return;area.classList.remove('hide');area.scrollIntoView({behavior:'smooth', block:'start'});drawHostChart();}
function drawHostChart(){
  const cv = $('hostChart');if(!cv || typeof Chart==='undefined') return;
  const top = sorted(S.players).slice(0,10);
  if(S.hostChart) S.hostChart.destroy();
  const col = top.map((_,i)=>['#8250df','#a78bfa','#c4b5fd'][i]||'#ddd6fe');
  const tc = getComputedStyle(document.body).getPropertyValue('--t2');
  S.hostChart = new Chart(cv, {type:'bar',data:{labels:top.map(p=>p.avatar+' '+p.name),datasets:[{data:top.map(p=>p.score),backgroundColor:col,borderRadius:8,borderSkipped:false}]},
    options:{responsive:true,maintainAspectRatio:false,layout:{padding:{top:18}},animation:{duration:1100,easing:'easeOutQuart',delay:c=>c.dataIndex*180},plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,ticks:{color:tc},grid:{color:'rgba(130,80,223,.12)'}},x:{ticks:{color:tc,font:{size:11}},grid:{display:false}}}}});
}
function status(p){const act=Date.now()-new Date(p.last_active)<40000;return p.fin?'⚪ Finished':p.done>0?(act?'🟠 Playing':'⚫ Away'):act?'🟢 Online':'⚫ Away'}
function updHost(){if(!$('stats'))return;const ps=S.players,on=ps.filter(p=>!p.fin&&Date.now()-new Date(p.last_active)<40000).length,fi=ps.filter(p=>p.fin).length,ld=sorted(ps)[0];
 const v=[['👥',ps.length,'Participants'],['🟢',on,'Online'],['✅',fi,'Finished'],['🏆',ld?ld.avatar+' '+h(ld.name):'–','Current leader'],['❓',Q().length,'Questions']];
 const old=[...$('stats').querySelectorAll('b')].map(b=>b.textContent);
 $('stats').innerHTML=v.map((x,i)=>`<div class="stat ${old[i]!==undefined&&old[i]!=String(x[1])?'bump':''}"><div style="font-size:22px">${x[0]}</div><b style="${i==3?'font-size:17px':''}">${x[1]}</b><small>${x[2]}</small></div>`).join('');
 $('rs').textContent={lobby:'Lobby',live:'Live',ended:'Ended'}[S.room.status];setLb('hl','');
 $('lg2').innerHTML=`<div class="row log h"><span></span><span>Participant</span><span>Redg</span><span>Email</span><span>Yr/Dept</span><span>Progress</span><span>Status</span><span></span></div>`+ps.map(p=>`<div class="row log" style="grid-template-columns:44px 1.1fr 1fr 1.4fr 0.8fr 70px 90px 80px"><span class="av2">${h(p.avatar)}</span><span class="nm">${h(p.name)}</span><span style="font-size:12px">${h(p.redg||'–')}</span><span style="font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${h(p.email||'–')}</span><span style="font-size:11px">${h(p.year||'–')} · ${h(p.dept||'–')}</span><span>${p.done}/${Q().length}</span><span class="bd">${status(p)}</span><button class="btn d s" onclick="rm('${h(p.id)}','${h(p.name).replace(/'/g,'')}')">Remove</button></div>`).join('')}
function rm(id,n){modal(`<div style="font-size:42px">🗑️</div><h2 style="margin:8px 0">Remove ${n}?</h2><p class="sub">They'll be taken out of the room and the leaderboard.</p><div style="display:flex;gap:8px;justify-content:center;margin-top:18px"><button class="btn t" onclick="closeM()">Cancel</button><button class="btn d" onclick="doRm('${id}')">Remove</button></div>`)}
async function doRm(id){await sb.from('players').delete().eq('id',id).eq('room_code',S.room.code);closeM();toast('Participant removed ✓');loadPlayers()}
async function setStatus(s){const{error}=await sb.from('rooms').update({status:s}).eq('code',S.room.code);if(error)return toast(error.message,1);S.room.status=s;toast(s==='live'?'Quiz started':'Quiz ended');updHost()}
function newQuiz(){unsub();L.removeItem('gq_host_room');S.room=null;S.players=[];if(S.hostChart){S.hostChart.destroy();S.hostChart=null}renderHost()}
function copyCode(){const b=$('cp'),t=S.room.code;(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).catch(()=>{const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove()});b.textContent='Copied ✓';setTimeout(()=>b.textContent='COPY ROOM CODE',1500)}

// ===== boot =====
theme(L.gq_theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'));
renderJoin();
// If you ever want the top nav on the main page too, uncomment the next line:
// mountNav();
</script>
</body>
</html>
